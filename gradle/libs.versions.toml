# Versions checked on Maven Central on 2026-10-29 (see docs/DESIGN.md §2).
[versions]
spark = "2.9.4"
jetty = "9.4.58.v20250814"   # forced over Spark's bundled 9.4.48; see docs/adr/0001
jooq = "3.21.9"
flyway = "13.11.1"
postgresql = "42.7.14"
hikari = "7.1.0"
lettuce = "7.9.0.RELEASE"
jackson = "2.22.4"
slf4j = "2.0.20"
logback = "1.6.6"
spock = "2.5-groovy-4.0"
groovy = "4.0.33"
junit = "5.14.4"             # the JUnit BOM Spock 2.5 is built against
testcontainers = "2.0.5"

[libraries]
spark-core = { module = "com.sparkjava:spark-core", version.ref = "spark" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-codegen = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
groovy-json = { module = "org.apache.groovy:groovy-json", version.ref = "groovy" }
groovy-yaml = { module = "org.apache.groovy:groovy-yaml", version.ref = "groovy" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
